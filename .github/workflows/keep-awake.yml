name: Keep Render Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render service
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" https://gestao-iscb.onrender.com/api/health || true
